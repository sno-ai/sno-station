<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">How Sno Station turns separate agents into one squad</title>
  <desc id="description">Two or more agents share one workspace, coordinate work, and improve the shared system overnight.</desc>
  <image href="squad-how-it-works-art.png" x="0" y="0" width="1600" height="760" preserveAspectRatio="none"/>
  <rect width="1600" height="760" fill="#05070c" fill-opacity="0.08"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- column headers -->
    <g text-anchor="middle">
      <text x="260" y="64" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="1.8">YOUR AGENTS</text>
      <line x1="205" y1="82" x2="315" y2="82" stroke="#2dd4bf" stroke-width="2"/>
      <text x="260" y="112" fill="#b6c2d1" font-size="20">Two or more, on different harnesses</text>

      <text x="800" y="64" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="1.8">SNO STATION</text>
      <line x1="745" y1="82" x2="855" y2="82" stroke="#2dd4bf" stroke-width="2"/>
      <text x="800" y="112" fill="#b6c2d1" font-size="20">On your laptop. No daemon. Open source.</text>

      <text x="1325" y="64" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="1.8">WHAT YOU GET</text>
      <line x1="1270" y1="82" x2="1380" y2="82" stroke="#2dd4bf" stroke-width="2"/>
      <text x="1325" y="112" fill="#b6c2d1" font-size="20">One squad instead of two tabs</text>
    </g>

    <!-- agent labels beside the two luminous forms -->
    <g>
      <text x="44" y="232" fill="#ffffff" font-size="24" font-weight="700">Agent A</text>
      <text x="44" y="261" fill="#9fb0c3" font-size="16">one harness</text>
      <text x="44" y="437" fill="#ffffff" font-size="24" font-weight="700">Agent B</text>
      <text x="44" y="466" fill="#9fb0c3" font-size="16">other harness</text>
      <rect x="58" y="615" width="420" height="78" rx="15" fill="#08121f" fill-opacity="0.72" stroke="#567083" stroke-width="1.5" stroke-dasharray="8 8"/>
      <text x="268" y="663" text-anchor="middle" fill="#b6c2d1" font-size="20" font-weight="600">a third one · any harness</text>
    </g>

    <!-- shared workspace -->
    <rect class="workspace-panel" x="545" y="158" width="510" height="536" rx="20" fill="#06111e" fill-opacity="0.92" stroke="#285567" stroke-width="1.5"/>
    <text x="800" y="218" text-anchor="middle" fill="#2dd4bf" font-size="22" font-weight="700" letter-spacing="3">ONE SHARED WORKSPACE</text>

    <g transform="translate(580,248)">
      <rect width="440" height="82" rx="12" fill="#0d1b2b" fill-opacity="0.94" stroke="#21394c"/>
      <circle cx="28" cy="41" r="7" fill="#2dd4bf"/>
      <text x="52" y="34" fill="#f8fafc" font-size="20" font-weight="700">Shared memory</text>
      <text x="52" y="60" fill="#aebccc" font-size="16">both agents read and write the same store</text>
    </g>
    <g transform="translate(580,344)">
      <rect width="440" height="82" rx="12" fill="#0d1b2b" fill-opacity="0.94" stroke="#21394c"/>
      <circle cx="28" cy="41" r="7" fill="#2dd4bf"/>
      <text x="52" y="34" fill="#f8fafc" font-size="20" font-weight="700">Sno Reach</text>
      <text x="52" y="60" fill="#aebccc" font-size="16">agents talk to each other, no daemon</text>
    </g>
    <g transform="translate(580,440)">
      <rect width="440" height="82" rx="12" fill="#0d1b2b" fill-opacity="0.94" stroke="#21394c"/>
      <circle cx="28" cy="41" r="7" fill="#2dd4bf"/>
      <text x="52" y="34" fill="#f8fafc" font-size="20" font-weight="700">Agent collaboration skills</text>
      <text x="52" y="60" fill="#aebccc" font-size="16">handoff · peer review · work orders</text>
    </g>
    <g transform="translate(580,536)">
      <rect width="440" height="82" rx="12" fill="#0d1b2b" fill-opacity="0.94" stroke="#21394c"/>
      <circle cx="28" cy="41" r="7" fill="#f0a04b"/>
      <text x="52" y="34" fill="#f8fafc" font-size="20" font-weight="700">RSI loop</text>
      <text x="52" y="60" fill="#aebccc" font-size="16">reads sessions, proposes changes, you accept</text>
    </g>

    <!-- outcome cards -->
    <g class="outcome-card" transform="translate(1118,178)">
      <rect width="420" height="132" rx="16" fill="#07131f" fill-opacity="0.86" stroke="#31586a" stroke-width="1.5"/>
      <text x="28" y="47" fill="#ffffff" font-size="21" font-weight="700">1 · Two heads on every job.</text>
      <text x="28" y="82" fill="#b6c2d1" font-size="17">different roles, each checks the other</text>
    </g>
    <g class="outcome-card" transform="translate(1118,354)">
      <rect width="420" height="132" rx="16" fill="#07131f" fill-opacity="0.86" stroke="#31586a" stroke-width="1.5"/>
      <text x="28" y="47" fill="#ffffff" font-size="21" font-weight="700">2 · Smarter by morning.</text>
      <text x="28" y="82" fill="#b6c2d1" font-size="17">the workspace learns; the models don&apos;t change</text>
    </g>
    <g class="outcome-card" transform="translate(1118,530)" aria-label="when one hits a limit, the other picks up, context intact">
      <rect width="420" height="132" rx="16" fill="#07131f" fill-opacity="0.86" stroke="#31586a" stroke-width="1.5"/>
      <text x="28" y="43" fill="#ffffff" font-size="21" font-weight="700">3 · Keep going.</text>
      <text x="28" y="77" fill="#b6c2d1" font-size="17">when one hits a limit, the other picks up,</text>
      <text x="28" y="102" fill="#b6c2d1" font-size="17">context intact</text>
    </g>
  </g>
</svg>
