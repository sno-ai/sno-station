<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 30 1600 380" role="img" aria-labelledby="title description">
  <title id="title">Sno Station: One person. A whole engineering team of AI agents.</title>
  <desc id="description">Two luminous spheres joined above a shared workspace plane, beside the Sno Station title.</desc>
  <defs>
    <linearGradient id="text-field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111d" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#08111d" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#05070c" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <image href="hero-art.png" x="0" y="0" width="1600" height="480" preserveAspectRatio="none"/>
  <rect x="620" y="0" width="980" height="480" fill="url(#text-field)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="712" y="118" fill="#2dd4bf" font-size="17" font-weight="700" letter-spacing="5.5">SNO STATION</text>
    <text x="708" y="212" fill="#ffffff" font-size="84" font-weight="700" letter-spacing="-2.4">One person.</text>
    <text x="712" y="272" fill="#e6edf3" font-size="38" font-weight="600" letter-spacing="-0.6">A whole engineering team of AI agents.</text>
    <text x="712" y="326" fill="#b6c2d1" font-size="22" font-weight="500">The workstation for your AI coding agents.</text>
  </g>
</svg>
