[package]
name = "reach-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
default-run = "reach-net"

[dependencies]
anyhow = "1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "signal", "fs", "time"] }
rustix = { version = "1", features = ["process"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-websockets = { version = "=0.13.3", features = ["client", "ring"] }
