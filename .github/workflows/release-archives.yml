name: release archives

# Builds the Linux Reach archives and the three small-program archives that `sno setup` downloads, and
# attaches them to the GitHub Release. The two macOS Reach archives are built on the team's own Mac and
# uploaded to the draft before this runs (recipe at the reach job). On a pull request it only builds.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to attach the archives to (the draft created by the npm publish)
        required: true
        type: string
      source_sha:
        description: Reviewed public main commit the archives are built from
        required: true
        type: string
  pull_request:
    paths:
      - apps/reach/**
      - apps/heartbeat/**
      - apps/report-time/**
      - apps/subscription-quota-check/**
      - apps/requirements-contract.json
      - .github/workflows/release-archives.yml

jobs:
  # The macOS archives are built on the team's own Mac, never on a GitHub-hosted Mac (owner, 2026-11-18), and are
  # uploaded to the draft before this runs; the attach step skips a name the draft already has. Recipe: on the Mac,
  # in apps/reach, `gmake package CC="cc -mmacosx-version-min=14.0"`, then clean vendor/mblaze and
  # `gmake package CC="cc -arch x86_64 -mmacosx-version-min=14.0" PLATFORM=macos-x86_64 RUST_TARGET=x86_64-apple-darwin`.
  # MACOSX_DEPLOYMENT_TARGET is not set: on macOS 27 it stops rustc 1.96 from loading proc macros.
  reach:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, make: make, extra: "" }
          - { name: linux-aarch64, os: ubuntu-22.04-arm, make: make, extra: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tools for Linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential perl jq
      - name: Build the Reach archive
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cd apps/reach
          ${{ matrix.make }} package ${{ matrix.extra }}
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: archives-reach-${{ matrix.name }}
          path: apps/reach/dist/*.tar.gz
          if-no-files-found: error

  programs:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every program changed since the last release has a new VERSION
        if: github.event_name == 'workflow_dispatch'
        run: |
          # An archive is named after its VERSION, and an archive an earlier release already has is carried over unchanged.
          stale=$(bash scripts/program-versions.sh)
          [ -z "$stale" ] || { echo "::error::Raise the VERSION of: $stale"; exit 1; }
      - name: Build heartbeat, report-time and subscription-quota-check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          for program in heartbeat report-time subscription-quota-check; do
            make -C "apps/$program" package CONTRACT="$PWD/apps/requirements-contract.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: archives-programs
          path: apps/*/dist/*.tar.gz
          if-no-files-found: error

  attach:
    if: github.event_name == 'workflow_dispatch'
    needs: [reach, programs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          merge-multiple: true
          path: archives
      - name: Attach the archives to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # A program version lives in exactly one published release. sno setup refuses to choose between two releases that
          # carry the same archive ("ambiguous release asset"). The newest page should still offer the downloads, so an archive
          # that an earlier release already has is copied to this draft byte for byte; the older copy is removed when this
          # release is published (scripts/npm-release.sh finalize). Another draft's files are never counted: nobody sees them.
          held=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .tag_name != env.TAG) | .tag_name as $t | .assets[] | "\($t) \(.name)"')
          on_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mkdir -p carried
          find archives -name '*.tar.gz' | while read -r file; do
            name=$(basename "$file")
            if grep -qxF "$name" <<< "$on_draft"; then
              echo "skip $name: $TAG already has it"
              continue
            fi
            holder=$(awk -v n="$name" '$2 == n { print $1; exit }' <<< "$held")
            if [ -n "$holder" ]; then
              echo "copy $name from $holder"
              gh release download "$holder" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir carried
              gh release upload "$TAG" "carried/$name" --repo "$GITHUB_REPOSITORY"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
